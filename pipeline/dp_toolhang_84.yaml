# Diffusion Policy on ToolHang: the authors' ToolHang image (CNN) config
# (diffusion-policy.cs.columbia.edu/data/experiments/image/tool_hang_ph/diffusion_policy_cnn), moved
# onto this repo's ToolHang rendering: agentview + wrist at 84 px (crop 76, as their Lift / Square
# 84 px runs), abs-derived actions (scripts/dp_abs_hdf5.py), 120 epochs, no rollouts during training
# (stub runner; collect.py evaluates), latest checkpoint only. Trained by scripts/train_dp.py.
_target_: diffusion_policy.workspace.train_diffusion_unet_hybrid_workspace.TrainDiffusionUnetHybridWorkspace
checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    format_str: epoch={epoch:04d}-train_loss={train_loss:.4f}.ckpt
    k: 0
    mode: min
    monitor_key: train_loss
dataloader:
  batch_size: 64
  num_workers: 8
  persistent_workers: false
  pin_memory: true
  shuffle: true
dataset_obs_steps: 2
ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0
exp_name: default
horizon: 16
keypoint_visible_rate: 1.0
logging:
  group: null
  id: null
  mode: disabled
  name: 2023.01.03-19.43.26_train_diffusion_unet_hybrid_tool_hang_image_abs
  project: diffusion_policy_debug
  resume: true
  tags:
  - train_diffusion_unet_hybrid
  - tool_hang_image_abs
  - default
multi_run:
  run_dir: data/outputs/2023.01.03/19.43.26_train_diffusion_unet_hybrid_tool_hang_image_abs
  wandb_name_base: 2023.01.03-19.43.26_train_diffusion_unet_hybrid_tool_hang_image_abs
n_action_steps: 8
n_latency_steps: 0
n_obs_steps: 2
name: dp_toolhang_84
obs_as_global_cond: true
optimizer:
  _target_: torch.optim.AdamW
  betas:
  - 0.95
  - 0.999
  eps: 1.0e-08
  lr: 0.0001
  weight_decay: 1.0e-06
past_action_visible: false
policy:
  _target_: diffusion_policy.policy.diffusion_unet_hybrid_image_policy.DiffusionUnetHybridImagePolicy
  cond_predict_scale: true
  crop_shape:
  - 76
  - 76
  diffusion_step_embed_dim: 128
  down_dims:
  - 512
  - 1024
  - 2048
  eval_fixed_crop: true
  horizon: 16
  kernel_size: 5
  n_action_steps: 8
  n_groups: 8
  n_obs_steps: 2
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    beta_start: 0.0001
    clip_sample: true
    num_train_timesteps: 100
    prediction_type: epsilon
    variance_type: fixed_small
  num_inference_steps: 100
  obs_as_global_cond: true
  obs_encoder_group_norm: true
  shape_meta:
    action:
      shape:
      - 10
    obs:
      robot0_eef_pos:
        shape:
        - 3
      robot0_eef_quat:
        shape:
        - 4
      robot0_eye_in_hand_image:
        shape:
        - 3
        - 84
        - 84
        type: rgb
      robot0_gripper_qpos:
        shape:
        - 2
      agentview_image:
        shape:
        - 3
        - 84
        - 84
        type: rgb
shape_meta:
  action:
    shape:
    - 10
  obs:
    robot0_eef_pos:
      shape:
      - 3
    robot0_eef_quat:
      shape:
      - 4
    robot0_eye_in_hand_image:
      shape:
      - 3
      - 84
      - 84
      type: rgb
    robot0_gripper_qpos:
      shape:
      - 2
    agentview_image:
      shape:
      - 3
      - 84
      - 84
      type: rgb
task:
  abs_action: true
  dataset:
    _target_: diffusion_policy.dataset.robomimic_replay_image_dataset.RobomimicReplayImageDataset
    abs_action: true
    dataset_path: ${task.dataset_path}
    horizon: 16
    n_obs_steps: 2
    pad_after: 7
    pad_before: 1
    rotation_rep: rotation_6d
    seed: 42
    shape_meta:
      action:
        shape:
        - 10
      obs:
        robot0_eef_pos:
          shape:
          - 3
        robot0_eef_quat:
          shape:
          - 4
        robot0_eye_in_hand_image:
          shape:
          - 3
          - 84
          - 84
          type: rgb
        robot0_gripper_qpos:
          shape:
          - 2
        agentview_image:
          shape:
          - 3
          - 84
          - 84
          type: rgb
    use_cache: true
    val_ratio: 0.02
  dataset_path: ???   # absolute path, given on the command line (pipeline/1_train.sh)
  dataset_type: ph
  env_runner:
    _target_: stub_runner.StubRunner
  name: tool_hang_image_abs
  shape_meta:
    action:
      shape:
      - 10
    obs:
      robot0_eef_pos:
        shape:
        - 3
      robot0_eef_quat:
        shape:
        - 4
      robot0_eye_in_hand_image:
        shape:
        - 3
        - 84
        - 84
        type: rgb
      robot0_gripper_qpos:
        shape:
        - 2
      agentview_image:
        shape:
        - 3
        - 84
        - 84
        type: rgb
  task_name: tool_hang
task_name: tool_hang_image_abs
training:
  checkpoint_every: 10
  debug: false
  device: cuda:0
  gradient_accumulate_every: 1
  lr_scheduler: cosine
  lr_warmup_steps: 500
  max_train_steps: null
  max_val_steps: null
  num_epochs: 120
  resume: true
  rollout_every: 1000000
  sample_every: 5
  seed: 42
  tqdm_interval_sec: 1.0
  use_ema: true
  val_every: 1
val_dataloader:
  batch_size: 64
  num_workers: 8
  persistent_workers: false
  pin_memory: true
  shuffle: false
