# Tool configuration only: this repo is not a package and is never pip-installed. Dependencies
# are in requirements.txt; everything lives flat in scripts/, which scripts and tests/conftest.py
# put on sys.path.

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
# UserWarning is deliberately NOT filtered: scipy/numpy raise one when the pinned versions drift
# (the robosuite/mujoco pins), and that is a signal, not noise.
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "external",
    "outputs",
    "*.ipynb",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line length handled by ruff format / docstrings
    "B008",  # do not perform function calls in argument defaults
    "B905",  # zip without strict=
]

[tool.ruff.lint.isort]
known-first-party = [   # scripts/ modules; tests import them by module name
    "dp_repo_policy", "env_factory", "interp_act_sites", "interp_augment", "interp_collect",
    "interp_demos_npz", "interp_dp_repair", "interp_edit", "interp_gainmap", "interp_grid",
    "interp_nuisance", "interp_regen", "interp_repairable", "interp_vla_repair", "policy",
    "robomimic_to_lerobot", "rollout", "rotation", "stamp_act_checkpoint", "stats",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "^external/",
]

[tool.coverage.run]
source = ["scripts"]
omit = [
    "*/tests/*",
    "*/external/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
