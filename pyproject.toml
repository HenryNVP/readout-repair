# readout_repair/ is the library behind scripts/, installed editable by scripts/setup_env.sh
# (pip install -e . --no-deps; dependencies are pinned in requirements.txt). Importing it puts the
# testbed modules in ros2_ws/src on sys.path.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "readout-repair"
version = "0.1.0"
description = "Head or representation? Last-layer retraining for distribution-shift failures of visuomotor policies"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["readout_repair"]

# The single pytest config: there is no pytest.ini (it would silently take precedence over
# this block). Tests live in the top-level tests/ rather than per-package test/ dirs — a third of
# them assert agreements BETWEEN packages, which have no honest
# home under one package.
[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
pythonpath = [".", "scripts"]
markers = [
    "ros2: test requires a sourced ROS2 environment (rclpy + message packages)",
    "integration: test spins real nodes over DDS (implies ros2); give it its own ROS_DOMAIN_ID",
]
# UserWarning is deliberately NOT filtered: scipy/numpy raise one when the pinned versions drift
# (the robosuite/mujoco pins), and that is a signal, not noise.
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "external",
    "outputs",
    "*.ipynb",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line length handled by ruff format / docstrings
    "B008",  # do not perform function calls in argument defaults
    "B905",  # zip without strict=
]

[tool.ruff.lint.isort]
known-first-party = [
    "readout_repair",
    "evh_plant",
    "evh_controller",
    "evh_reactive",
    "to_lerobot",             # scripts/ modules are ours too; tests import them by module name
    "stamp_act_checkpoint",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "^external/",
]

[tool.coverage.run]
source = ["readout_repair", "ros2_ws/src"]
omit = [
    "*/tests/*",
    "*/external/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
